[project]
name="frontend"
version="0.1.0"
dependencies = [
    "pyserial>=3.5",
    "esptool>=4.8,<6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scikit-learn>=1.2,<2.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "joblib>=1.2.0",
]


[tool.vercel]
entrypoint = "backend.server:app"


[tool.vercel.scripts]
build = "python build.py"
